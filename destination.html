{% extends "_base.html" %}
{% block title %}الوجهة — رحلاتي الذكية{% endblock %}
{% block content %}
<div id="destBox"><div class="loading-spinner"></div></div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const box = document.getElementById("destBox");
  if (!code) { box.innerHTML = `<div class="container"><div class="empty-state">وجهة غير محددة</div></div>`; return; }

  try {
    const dest = await Api.destination(code);
    box.innerHTML = `
      <div style="position:relative; height:280px;">
        <img src="${dest.image_url}" style="width:100%;height:100%;object-fit:cover;">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(10,22,38,.85));display:flex;align-items:flex-end;">
          <div class="container" style="padding-bottom:20px;">
            <h1 style="color:#fff;font-family:var(--font-display);margin:0;">${dest.city_ar}</h1>
            <span style="color:rgba(255,255,255,.8)">${dest.country}</span>
          </div>
        </div>
      </div>
      <div class="container section">
        <p style="max-width:640px;">${dest.description_ar || ""}</p>
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin:20px 0 30px;">
          <a href="/?dest=${dest.airport_code}" class="btn btn-primary">🔍 ابحث عن رحلات إلى ${dest.city_ar}</a>
          <a href="/assistant?destination=${encodeURIComponent(dest.city_ar)}" class="btn btn-outline">🤖 مساعد السفر الذكي</a>
        </div>
        <h3 class="section-title">📍 أشهر الأماكن</h3>
        <div class="places-grid" id="placesGrid"><div class="loading-spinner"></div></div>
      </div>
    `;

    try {
      const places = await Api.popularPlaces(dest.city_ar);
      document.getElementById("placesGrid").innerHTML = places.places.map(p => `<div class="place-chip">${p}</div>`).join("");
    } catch (e) {
      document.getElementById("placesGrid").innerHTML = `<div class="empty-state">تعذر تحميل الأماكن</div>`;
    }
  } catch (e) {
    box.innerHTML = `<div class="container"><div class="empty-state">تعذر تحميل بيانات الوجهة</div></div>`;
  }
});
</script>
{% endblock %}
